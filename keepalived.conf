global_defs {
    enable_script_security
}
vrrp_script chk_webserver {
    script "/home/test2/check_webserver.sh"
    interval 3
    weight -50
}

vrrp_instance VI_1 {
        state BACKUP
        interface enp0s3 
        virtual_router_id 15
        priority 190
        advert_int 1
        authentication {
               auth_type PASS
               auth_pass 12345678
        }
        virtual_ipaddress {
              192.168.2.150/22
        }
       track_script {
              chk_webserver
        }
}
